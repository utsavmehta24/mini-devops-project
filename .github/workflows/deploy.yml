name: CI/CD Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Docker Image
        run: |
          docker build -t rockingut/devops-flask:latest .
          docker push rockingut/devops-flask:latest
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull rockingut/devops-flask:latest
            
            # Stop and remove any container named flask
            docker stop flask 2>/dev/null || true
            docker rm flask 2>/dev/null || true
            
            # Find and stop any container using port 80
            CONTAINER_ON_80=$(docker ps -q --filter "publish=80")
            if [ ! -z "$CONTAINER_ON_80" ]; then
              echo "Found container using port 80: $CONTAINER_ON_80"
              docker stop $CONTAINER_ON_80
              docker rm $CONTAINER_ON_80
            fi
            
            # Start the new container
            docker run -d --name flask -p 80:5000 --restart unless-stopped rockingut/devops-flask:latest
            
            # Wait for container to be fully running
            echo "Waiting for container to start..."
            sleep 3
            
            # Check if container is running
            if ! docker ps | grep -q flask; then
              echo "ERROR: Container failed to start"
              docker logs flask
              exit 1
            fi
            
            echo "Container is running. Checking health endpoint..."
            
            # Health check with more retries and better error handling
            MAX_RETRIES=15
            RETRY_DELAY=3
            
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Health check attempt $i/$MAX_RETRIES..."
              
              # Use curl with better error handling
              if curl -f -s -o /dev/null -w "%{http_code}" http://localhost/health | grep -q "200"; then
                echo "✓ Health check passed!"
                echo "Deployment successful!"
                docker ps | grep flask
                exit 0
              fi
              
              if [ $i -lt $MAX_RETRIES ]; then
                echo "  Health check failed, retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            done
            
            # If we get here, health checks failed
            echo "✗ Health check failed after $MAX_RETRIES attempts"
            echo "Container logs:"
            docker logs flask
            echo "Container status:"
            docker ps -a | grep flask
            exit 1