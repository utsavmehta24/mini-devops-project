name: CI/CD Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Docker Image
        run: |
          docker build -t rockingut/devops-flask:latest .
          docker push rockingut/devops-flask:latest
          
      - name: Image pushed successfully
        run: |
          echo "✓ Docker image built and pushed successfully!"
          echo "Image: rockingut/devops-flask:latest"
          echo ""
          echo "To run this image locally:"
          echo "  docker pull rockingut/devops-flask:latest"
          echo "  docker run -d -p 5000:5000 --name flask-app rockingut/devops-flask:latest"
          echo ""
          echo "To deploy to a server:"
          echo "  1. SSH into your server"
          echo "  2. Pull the image: docker pull rockingut/devops-flask:latest"
          echo "  3. Run: docker run -d -p 80:5000 --name flask-app --restart unless-stopped rockingut/devops-flask:latest"